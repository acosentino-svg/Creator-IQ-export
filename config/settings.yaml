# Tunable business rules for the activation dashboard.
# Edit these to match how your creator program defines "active" / "at risk" / "dormant".

activation:
  # A creator counts as "active" if they had a qualifying action (post, link click
  # event, or accepted deliverable) within this many days.
  active_window_days: 14
  # "At risk": no qualifying action for at least this many days, but not yet dormant.
  at_risk_window_days: 30
  # "Dormant": no qualifying action for at least this many days.
  dormant_window_days: 60
  # Weights for the composite 0-100 activation score. Must sum to 1.0.
  score_weights:
    recency: 0.4
    frequency: 0.35
    diversity: 0.15
    trend: 0.10
  # Trailing window (days) used for the "frequency" component of the score.
  frequency_window_days: 30

email_engagement:
  # A creator's email engagement is "healthy" if they opened at least one email
  # in the trailing window below.
  recent_open_window_days: 30
  # Flag creators as "cold" (needing a different outreach channel) if they haven't
  # opened in this many days, or across this many consecutive sends.
  cold_after_days: 45
  cold_after_consecutive_unopened_sends: 3

spike_detection:
  # Rolling baseline window (days) used to compute the mean/std for z-score spikes.
  baseline_window_days: 28
  # Minimum absolute count required before a day can be flagged as a spike
  # (avoids flagging "2 vs 0" as a huge spike for tiny programs/cohorts).
  min_count_for_spike: 3
  # z-score threshold above which a day is flagged as a spike.
  z_score_threshold: 2.0

alerts:
  # Post a weekly digest (needs-attention creators + spikes) to Slack if
  # SLACK_WEBHOOK_URL is configured.
  weekly_digest_enabled: true

live_sync:
  # Safety limits for pulling from the real CreatorIQ API (see
  # src/creatoriq_dashboard/etl.py). Tune these up once you've confirmed a
  # small sync works end-to-end -- CreatorIQ accounts can have hundreds of
  # campaigns and each one requires its own API calls (roster + posts).
  #
  # Only sync campaigns matching these statuses (set to [] to sync all).
  campaign_status_filter: ["Active"]
  # Cap how many campaigns get synced per run (null = no cap). Start small
  # (e.g. 5-10) the first time you point this at a real account.
  max_campaigns: 10
  # Whether to resolve each creator's NetworkPublisherId via an extra
  # /publishers?filter= lookup when it wasn't already available from a post
  # (needed to fetch that creator's email/messages). Costs one extra API
  # call per creator who hasn't posted yet.
  resolve_missing_network_ids: true
  # Cap on total per-creator email/message lookups per run (each is 1-2 API
  # calls: optional ID resolution + the messages fetch). null = no cap.
  max_email_lookups: 300
